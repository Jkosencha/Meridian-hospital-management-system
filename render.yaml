services:
  - type: web
    name: meridian-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install pipenv && pipenv install --deploy --system
    startCommand: flask db upgrade && flask seed-users && gunicorn run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: "*"
      - key: PYTHON_VERSION
        value: "3.14.5"

  - type: web
    name: meridian-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
